[project]
name = "org-blogger"
version = "0.1.0"
description = "Publish Org mode documents to Blogger."
authors = [
    {name = "Daniel Muñoz", email = "demunoz2@uc.cl"}
]
readme = {file = "README.org", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "orgparse (>=0.4.20250520,<0.5.0)",
    "google-api-python-client (>=2.185.0,<3.0.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)",
    "packaging (>=25.0,<26.0)"
]

[project.scripts]
org-blogger = "org_blogger.cli:main"
publish-blog = "org_blogger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/org_blogger"]
